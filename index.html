<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="市民之夜｜全城相聚 🧡"><meta property="og:description" content="尋找直播據點、店家報名、預訂座位"><title>市民之夜｜全城相聚</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fff5eb;color:#482c1c;font:16px/1.6 system-ui,sans-serif}header{background:#b64712;color:white;padding:26px 18px}header>div,main{max-width:760px;margin:auto}h1{font-size:40px;margin:0}h2{font-size:21px;margin:0 0 10px}p{margin:8px 0}main{padding:14px}section,article{background:white;border:1px solid #edd8c9;border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-weight:650;margin:12px 0 4px}input,button,select{font:inherit}input,select{width:100%;border:1px solid #ccb19e;border-radius:9px;padding:10px;color:inherit;background:white}button{border:0;border-radius:10px;background:#a83a0b;color:white;font-weight:700;padding:11px;cursor:pointer}button.secondary{background:#ffe5d0;color:#80300c}button:disabled{opacity:.5;cursor:not-allowed}nav,.row,.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin-bottom:14px}nav button{flex:1;white-space:nowrap}.row{justify-content:space-between}.stats{margin-top:18px}.stat{flex:1;border:1px solid #ffffff70;border-radius:12px;text-align:center;padding:8px 3px;font-size:13px}.stat b{display:block;font-size:26px}.muted{color:#745747;font-size:14px}.notice{background:white;border:1px solid #e7c5ac;border-radius:10px;padding:10px;margin-bottom:12px;overflow-wrap:anywhere}#map,#pickmap{height:300px;border-radius:10px;margin:12px 0;z-index:0}#pickmap{height:220px}.bar{background:#f2e4d8;height:8px;border-radius:99px;overflow:hidden}.fill{background:#c65b25;height:100%}.seat{color:#8a350f;font-weight:bold}a{color:#a83a0b}[hidden]{display:none!important}dialog{width:min(95%,420px);max-height:90vh;overflow:auto;border:1px solid #edd8c9;border-radius:16px;padding:20px;color:inherit}dialog::backdrop{background:#26160e99}.full{width:100%;margin-top:12px}#share{background:white;color:#943708;margin-top:10px}footer{text-align:center;color:#745747;font-size:13px;padding:14px}@media(max-width:420px){nav button{font-size:14px}.stat b{font-size:23px}section{padding:13px}#map{height:260px}}
</style></head><body><header><div><h1>市民之夜 🧡</h1><p>沒有共同的場地，依然有共同的夜晚。<br>全城相聚，共度市民之夜。</p><button id="share">分享活動連結 ↗</button><div class="stats"><div class="stat"><b id="total">—</b>參與店家</div><div class="stat"><b id="booked">—</b>已預訂人數</div><div class="stat"><b id="left">—</b>剩餘座位</div></div></div></header><main><div id="notice" class="notice" role="status">載入中…</div><nav><button data-tab="find">我要預訂</button><button data-tab="join" class="secondary">店家報名</button><button data-tab="mine" class="secondary">我的預訂</button></nav>
<section id="find"><h2>尋找直播據點</h2><p class="muted">選擇店家，填寫姓名、手機與人數，即可預訂。不需註冊或簡訊。</p><div id="map"></div><label>搜尋店名或地址<input id="search" placeholder="例如：大安、咖啡"></label><div id="venues"></div></section>
<section id="join" hidden><h2>店家報名</h2><p>管理員確認後即會公開。</p><form id="venueform"><label>店家名稱<input name="name" required maxlength="100"></label><label>店家地址<input name="address" required minlength="5" maxlength="200" placeholder="台北市○○區○○路…"></label><label>可容納人數<input name="capacity" type="number" min="1" max="2000" required></label><label>在地圖標示店家位置（選填）</label><div id="pickmap"></div><p id="coords" class="muted">未選擇位置也可報名，地址會顯示於列表。</p><label><input type="checkbox" required style="width:auto"> 我已獲店家同意提供直播觀看空間。</label><button id="submitVenue" class="full" disabled>送出店家報名</button><p id="joinStatus" role="status"></p></form></section>
<section id="mine" hidden><h2>我的預訂</h2><div id="mylist"></div><p class="muted">請使用原本的瀏覽器與裝置查詢或取消。清除瀏覽器資料後可能無法查詢。</p></section></main>
<dialog id="bookingDialog"><form id="bookingForm"><div class="row"><h2 id="bookingTitle">預訂座位</h2><button type="button" id="closeDialog" class="secondary">關閉</button></div><label>姓名<input name="name" autocomplete="name" required maxlength="80"></label><label>手機號碼<input name="phone" type="tel" autocomplete="tel" required maxlength="20" placeholder="09XXXXXXXX"></label><label>預訂人數<select name="seats" id="seatSelect" required></select></label><p class="muted">姓名與手機僅供管理員處理預訂，不會公開；手機號碼未經簡訊驗證。</p><label><input type="checkbox" required style="width:auto"> 同意提供上述資料作為預訂用途。</label><button id="confirmBooking" class="full">確認預訂</button><p id="bookingStatus" role="status"></p></form></dialog><footer>全城相聚，共度市民之夜。</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
'use strict';const $=x=>document.getElementById(x), cfg=window.EVENT_CONFIG||{}, url='https://charliecurie.github.io/taipei-citizen-night/';let db,rows=[],current=null,picked=null,marker,map,pickmap,layer,busy=false,loaded=false,mineRow=null,tab='find',key=null;
function el(t,v,c){const a=document.createElement(t);if(v!=null)a.textContent=v;if(c)a.className=c;return a}
function msg(t){$('notice').textContent=t}function error(e){const m=e?.message||'';return /^(請|每次|此|剩餘|目前|操作)/.test(m)?m:'操作未完成，請稍後再試。'}
try{key=localStorage.getItem('citizen-night-reservation-v1');if(!/^[0-9a-f-]{36}$/i.test(key||'')){key=crypto.randomUUID();localStorage.setItem('citizen-night-reservation-v1',key)}}catch(e){key=null}
if(window.L){const tiles=m=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(m);map=L.map('map').setView([25.0478,121.5319],12);tiles(map);layer=L.layerGroup().addTo(map);pickmap=L.map('pickmap').setView([25.0478,121.5319],12);tiles(pickmap);pickmap.on('click',e=>{picked=e.latlng;if(marker)marker.setLatLng(picked);else marker=L.marker(picked).addTo(pickmap);$('coords').textContent='已標示店家位置'})}else{$('map').textContent='地圖暫時無法載入，仍可使用列表。'}
async function rpc(n,a={}){const {data,error}=await db.rpc(n,a);if(error)throw error;return data}
function show(t){tab=t;for(const k of ['find','join','mine'])$(k).hidden=k!==t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==t));setTimeout(()=>{if(t==='find')map?.invalidateSize();if(t==='join')pickmap?.invalidateSize()},50);if(t==='mine')loadMine()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function render(){const root=$('venues');root.replaceChildren();layer?.clearLayers();$('total').textContent=loaded?rows.length:'—';$('booked').textContent=loaded?rows.reduce((a,b)=>a+b.booked,0):'—';$('left').textContent=loaded?rows.reduce((a,b)=>a+Math.max(0,b.capacity-b.booked),0):'—';const q=$('search').value.trim().toLowerCase(), filtered=rows.filter(v=>(v.name+' '+v.address).toLowerCase().includes(q));if(!filtered.length)root.append(el('p',loaded?'目前沒有符合條件的店家。':'載入店家中…','muted'));for(const v of filtered){const left=Math.max(0,v.capacity-v.booked),card=el('article');card.id='venue-'+v.id;card.append(el('h2',v.name),el('p',v.address,'muted'),el('p','已預訂 '+v.booked+' 人｜剩餘 '+left+' 席','seat'));const bar=el('div',null,'bar'),fill=el('div',null,'fill');fill.style.width=Math.min(100,100*v.booked/v.capacity)+'%';bar.append(fill);card.append(bar);const row=el('div',null,'row');row.style.marginTop='12px';const a=el('a','交通路線');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.address);a.target='_blank';a.rel='noopener noreferrer';const b=el('button',left?'預訂座位':'已額滿');b.disabled=!left||busy||!key;b.onclick=()=>openBooking(v);row.append(a,b);card.append(row);root.append(card);if(layer&&v.lat!=null&&v.lng!=null)L.marker([v.lat,v.lng]).addTo(layer).bindTooltip(String(left)+' 席').on('click',()=>card.scrollIntoView({behavior:'smooth'}))}}
function openBooking(v){current=v;$('bookingForm').reset();$('bookingTitle').textContent=v.name; $('bookingStatus').textContent='';$('seatSelect').replaceChildren();for(let i=1;i<=Math.min(4,v.capacity-v.booked);i++){const o=el('option',i+' 人');o.value=i;$('seatSelect').append(o)}$('bookingDialog').showModal()}
$('closeDialog').onclick=()=>$('bookingDialog').close();$('search').oninput=render;
async function refresh(){try{rows=await rpc('list_restaurants_with_capacity');loaded=true;$('submitVenue').disabled=busy;render()}catch(e){loaded=false;msg(error(e))}}
async function loadMine(){const root=$('mylist');root.replaceChildren();if(!key||!db){root.append(el('p','無法使用此瀏覽器查詢預訂。'));return}try{const data=await rpc('my_restaurant_reservation',{p_browser_key:key});mineRow=data?.[0];if(!mineRow){root.append(el('p','目前沒有預訂。'));return}const v=mineRow;root.append(el('h2',v.name),el('p',v.address+'｜'+v.seats+' 人'),el('p','預訂編號：'+v.id,'muted'));const b=el('button','取消預訂','secondary');b.onclick=async()=>{if(!confirm('確定取消預訂？'))return;b.disabled=true;try{await rpc('cancel_restaurant_reservation',{p_browser_key:key});msg('已取消預訂。');await refresh();await loadMine()}catch(e){msg(error(e));b.disabled=false}};root.append(b)}catch(e){root.append(el('p',error(e)))}}
$('bookingForm').onsubmit=async e=>{e.preventDefault();if(busy||!current||!key)return;busy=true;$('confirmBooking').disabled=true;const f=new FormData(e.target);try{await rpc('reserve_restaurant_named',{p_restaurant:current.id,p_seats:Number(f.get('seats')),p_browser_key:key,p_name:f.get('name'),p_phone:f.get('phone')});$('bookingDialog').close();msg('預訂成功！');show('mine');await refresh()}catch(e){$('bookingStatus').textContent=error(e)}finally{busy=false;$('confirmBooking').disabled=false;render()}};
$('venueform').onsubmit=async e=>{e.preventDefault();if(busy||!loaded)return;busy=true;$('submitVenue').disabled=true;const f=new FormData(e.target);try{await rpc('submit_restaurant',{p_name:f.get('name'),p_address:f.get('address'),p_capacity:Number(f.get('capacity')),p_lat:picked?.lat??null,p_lng:picked?.lng??null});$('joinStatus').textContent='報名成功！管理員確認後將公開。';e.target.reset();picked=null;if(marker){marker.remove();marker=null}$('coords').textContent='尚未標示位置'}catch(e){$('joinStatus').textContent=error(e)}finally{busy=false;$('submitVenue').disabled=false}};
$('share').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'市民之夜 🧡',text:'全城相聚，共度市民之夜。',url});return}await navigator.clipboard.writeText(url);msg('已複製活動連結！')}catch(e){if(e.name!=='AbortError')prompt('複製活動連結',url)}};
async function init(){if(!cfg.key||!window.supabase){msg('網站尚未連接資料庫。');return}db=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});await refresh();if(loaded)msg(key?'歡迎！請選擇直播據點或店家報名。':'瀏覽器儲存功能未開啟，無法預訂，但仍可查看店家。');setInterval(()=>{if(!busy)refresh()},30000)}init().catch(e=>msg(error(e)));
</script></body></html>
