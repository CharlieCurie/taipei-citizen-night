<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市民之夜｜台北一起發光</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fff5eb;color:#492b1b;font:16px/1.6 system-ui,sans-serif}header{background:linear-gradient(125deg,#a63c0a,#c4510d);color:white;padding:32px 18px 24px}main,header>div{max-width:850px;margin:auto}h1{margin:0;font-size:clamp(26px,5vw,40px)} .slogan{font-size:clamp(16px,3.6vw,21px);font-weight:550;line-height:1.7;margin-top:12px} .stat{min-width:0} .stat b{font-variant-numeric:tabular-nums} @media(max-width:480px){header{padding:25px 14px 20px}main{padding:10px}section,article{padding:12px}.stat{padding:8px 3px;font-size:12px}.stat b{font-size:23px}nav button{font-size:14px;padding:10px 6px}#map{height:300px}} h2{font-size:21px;margin:0 0 12px}p{margin:8px 0}main{padding:16px}button,input,select{font:inherit}button{cursor:pointer;border:0;background:#b9470c;color:white;padding:10px 15px;border-radius:10px;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e88733;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#ffead7;color:#83340e}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}nav button{flex:1;white-space:nowrap}section,article{background:white;border:1px solid #f2d7c0;border-radius:14px;padding:16px;margin-bottom:12px}label{display:block;margin:10px 0 4px;font-weight:600}input,select{width:100%;padding:10px;border:1px solid #dcb99d;border-radius:8px;color:#492b1b;background:white}#map,#pickmap{height:320px;border-radius:12px;margin-top:12px;z-index:0}#pickmap{height:220px}.stats{display:flex;gap:10px;margin-top:22px}.stat{flex:1;text-align:center;border:1px solid #ffffff50;border-radius:12px;padding:10px}.stat b{display:block;font-size:26px}.muted,small{color:#775340}.notice{padding:10px;border:1px solid #e9c4a5;border-radius:10px;background:#fff;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.seat{font-weight:700;color:#b9470c}.full{color:#a52c35}footer{text-align:center;padding:20px;font-size:13px;color:#775340}[hidden]{display:none!important}#captcha{margin:12px 0}a{color:#a53c0b}.card-title{font-size:18px;font-weight:700}.map-number{background:#b9470c;color:white;border:2px solid white;border-radius:20px;padding:4px 8px;white-space:nowrap;font-weight:bold;box-shadow:0 2px 5px #0003;width:max-content!important;height:auto!important}
</style></head><body><header><div><small style="color:#ffe3ca">市民之夜・全台北直播據點</small><h1>台北一起發光 🧡</h1><p class="slogan">沒有共同的場地，依然有共同的夜晚。<br>全城相聚，共度市民之夜。🧡</p><div class="stats"><div class="stat"><b id="total">—</b>參與店家</div><div class="stat"><b id="booked">—</b>已預訂人數</div><div class="stat"><b id="left">—</b>剩餘座位</div></div></div></header><main><div class="notice" id="notice" role="status">載入中…</div><nav><button data-tab="find">尋找據點</button><button data-tab="join" class="secondary">店家報名</button><button data-tab="mine" class="secondary">我的預訂</button></nav><section id="auth"><div class="row"><h2>手機身分驗證</h2><button id="logout" hidden class="secondary">登出</button></div><div id="login"><label for="phone">手機號碼（美國 +1 僅供登入測試）</label><input id="phone" type="tel" autocomplete="tel" placeholder="09XXXXXXXX 或 +1XXXXXXXXXX" maxlength="16"><div id="captcha"></div><button id="send" disabled>發送驗證碼</button><label for="otp">簡訊驗證碼</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8"><button id="verify" disabled>完成驗證</button><p class="muted">手機號碼僅供驗證及預訂管理，不會公開。</p></div><p id="signed" hidden>已完成手機驗證。</p></section><section id="find"><h2>尋找直播據點</h2><label for="district">行政區</label><select id="district"></select><label><input type="checkbox" id="available" style="width:auto"> 只顯示有空位的店家</label><div id="map"></div><div id="venues" style="margin-top:14px"></div></section><section id="join" hidden><h2>店家報名</h2><p>報名後由管理員確認店家資料，核准後才會公開。</p><form id="venueform"><label>店家名稱<input name="name" required minlength="2" maxlength="80"></label><label>行政區<select name="district" id="joinDistrict"></select></label><label>完整地址<input name="address" required minlength="5" maxlength="160"></label><label>請在地圖點選店家位置</label><div id="pickmap"></div><p id="coords" class="muted">尚未選擇位置</p><label>可提供座位數<input name="capacity" type="number" min="1" max="500" required></label><label>開放時段<input name="hours" required maxlength="80" placeholder="例如 18:00–22:00"></label><label>消費方式<input name="terms" required maxlength="160"></label><label>店家聯絡方式（僅管理員可見）<input name="contact" required minlength="5" maxlength="100"></label><label><input type="checkbox" required style="width:auto"> 我已獲店家同意提供上述直播觀看空間</label><button id="submitVenue" disabled>送出店家報名</button></form></section><section id="mine" hidden><h2>我的預訂</h2><div id="mylist">請先完成手機驗證。</div></section></main><footer>全城相聚，共度市民之夜。<br>請勿公開或輸入他人的個人資料。</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const districts=['中正區','大同區','中山區','松山區','大安區','萬華區','信義區','士林區','北投區','內湖區','南港區','文山區'];const cfg=window.EVENT_CONFIG||{};let db,user,shops=[],settings={},picked,marker,captchaToken='',tab='find',otpPhone='',busy=false,loaded=false;
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}function note(t){$('notice').textContent=t}function err(e){const m=e?.message||'';const code=typeof e?.code==='string'&&/^[a-z][a-z0-9_]{0,70}$/.test(e.code)?e.code:'';const status=Number.isInteger(e?.status)&&e.status>=100&&e.status<=599?String(e.status):'';const labels={captcha_failed:'人機驗證失敗，請重新驗證。',phone_provider_disabled:'手機驗證服務尚未啟用。',sms_send_failed:'簡訊服務發送失敗，請聯絡管理員。',over_sms_send_rate_limit:'簡訊發送過於頻繁，請稍後再試。',over_request_rate_limit:'操作過於頻繁，請稍後再試。',otp_expired:'驗證碼無效或已過期。',validation_failed:'輸入資料未通過驗證。',unexpected_failure:'驗證服務暫時發生錯誤。'};const local=!code&&!status&&/^(請輸入有效的台灣手機號碼|請先)/.test(m);const msg=Object.prototype.hasOwnProperty.call(labels,code)?labels[code]:local?m:'操作未完成，請稍後重試或聯絡管理員。';note(msg+(code||status?'（錯誤代碼：'+[code,status].filter(Boolean).join(' / ')+'）':''))}function option(s,v){const o=node('option',s);o.value=v;return o}$('district').append(option('全部行政區',''));for(const d of districts){$('district').append(option(d,d));$('joinDistrict').append(option(d,d))}const tiles=m=>L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(m);let map,pickmap,layer;if(window.L){map=L.map('map').setView([25.0478,121.5319],12);tiles(map);layer=L.layerGroup().addTo(map);pickmap=L.map('pickmap').setView([25.0478,121.5319],12);tiles(pickmap);pickmap.on('click',e=>{picked=e.latlng;if(marker)marker.setLatLng(picked);else marker=L.marker(picked).addTo(pickmap);$('coords').textContent='已選擇店家位置：'+picked.lat.toFixed(5)+'，'+picked.lng.toFixed(5)})}else{$('map').textContent='地圖載入失敗，仍可查看列表。'}
function show(t){tab=t;for(const k of ['find','join','mine'])$(k).hidden=k!==t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==t));if(t==='find')setTimeout(()=>map?.invalidateSize(),30);if(t==='join')setTimeout(()=>pickmap?.invalidateSize(),30);if(t==='mine')mine()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function state(){const logged=!!user;$('login').hidden=logged;$('signed').hidden=!logged;$('logout').hidden=!logged;$('send').disabled=!db||!loaded||!cfg.captchaSiteKey||!captchaToken||busy;$('verify').disabled=!db||!loaded||!otpPhone||busy;$('submitVenue').disabled=!logged||!settings.applications_open||busy;render()}
function render(){const available=shops.filter(s=>(!$('district').value||s.district===$('district').value)&&(!$('available').checked||s.capacity>s.booked));const root=$('venues');root.replaceChildren();layer?.clearLayers();$('total').textContent=loaded?shops.length:'—';$('booked').textContent=loaded?shops.reduce((a,s)=>a+s.booked,0):'—';$('left').textContent=loaded?shops.reduce((a,s)=>a+Math.max(0,s.capacity-s.booked),0):'—';if(!loaded)root.append(node('p','店家資料尚未成功載入，請稍後再試。','muted'));else if(!available.length)root.append(node('p','目前沒有符合條件的已核准店家。','muted'));for(const s of available){const rem=Math.max(0,s.capacity-s.booked),a=node('article');a.id='v-'+s.id;const line=node('div',undefined,'row');line.append(node('span',s.name,'card-title'),node('span',rem?'剩餘 '+rem+' 席':'已額滿',rem?'seat':'seat full'));a.append(line,node('p',s.district+'｜'+s.address),node('p','開放時段：'+s.hours+'｜'+s.terms,'muted'),node('p','已預訂 '+s.booked+'／'+s.capacity+' 人','muted'));const link=node('a','查看交通路線');link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.address);link.target='_blank';link.rel='noopener noreferrer';a.append(link);const controls=node('div',undefined,'row');const count=node('select');count.style.width='auto';count.setAttribute('aria-label','預訂人數');for(let n=1;n<=Math.min(rem,4);n++)count.append(option(n+' 人',n));const b=node('button',!settings.booking_open?'尚未開放':!rem?'已額滿':!user?'請先驗證手機':'確認預訂');b.disabled=!db||!user||!rem||!settings.booking_open||busy;b.onclick=()=>reserve(s.id,Number(count.value));controls.append(count,b);a.append(controls);root.append(a);if(layer){const icon=L.divIcon({className:'map-number',html:rem?String(rem)+' 席':'額滿'});L.marker([s.lat,s.lng],{icon}).addTo(layer).on('click',()=>a.scrollIntoView({behavior:'smooth',block:'center'}))}}}
$('district').onchange=render;$('available').onchange=render;
async function rpc(name,args){const {data,error}=await db.rpc(name,args||{});if(error)throw error;return data}
async function refresh(){if(!db)return;try{const [v,s]=await Promise.all([rpc('list_venues'),rpc('public_settings')]);shops=v||[];settings=s?.[0]||{};loaded=true;state()}catch(e){settings={};loaded=false;shops=[];state();err(e)}}
async function reserve(id,n){if(busy)return;const venue=shops.find(v=>v.id===id);if(!venue||!confirm('確定預訂 '+venue.name+'，共 '+n+' 人？'))return;busy=true;state();try{await rpc('reserve_seats',{p_venue:id,p_seats:n});note('預訂成功！');show('mine');await refresh()}catch(e){err(e);await refresh()}finally{busy=false;state()}}
async function mine(){const list=$('mylist');list.replaceChildren();if(!db||!user){list.append(node('p','請先完成手機驗證。'));return}try{const rows=await rpc('my_bookings');if(!rows.length)list.append(node('p','目前沒有預訂。'));for(const r of rows){const a=node('article');a.append(node('b',r.name),node('p',r.address+'｜'+r.seats+' 人'),node('p',r.status==='active'?'預訂成功':'已取消','muted'),node('small','預訂編號：'+r.id));if(r.status==='active'){const b=node('button','取消預訂','secondary');b.onclick=async()=>{if(!confirm('確定取消預訂並釋出座位？'))return;b.disabled=true;try{const ok=await rpc('cancel_booking',{p_id:r.id});note(ok?'已取消預訂。':'此預訂已取消或不存在。');await mine();await refresh()}catch(e){err(e);b.disabled=false}};a.append(node('p'),b)}list.append(a)}}catch(e){err(e)}}
$('venueform').onsubmit=async e=>{e.preventDefault();if(busy||!user||!settings.applications_open)return;if(!picked){note('請先在地圖點選店家位置。');return}const f=new FormData(e.target);busy=true;state();try{await rpc('submit_venue',{p_name:f.get('name'),p_district:f.get('district'),p_address:f.get('address'),p_lat:picked.lat,p_lng:picked.lng,p_capacity:Number(f.get('capacity')),p_hours:f.get('hours'),p_terms:f.get('terms'),p_contact:f.get('contact')});note('店家報名已送出，請等待人工審核。');e.target.reset();picked=null;if(marker){marker.remove();marker=null}$('coords').textContent='尚未選擇位置'}catch(e){err(e)}finally{busy=false;state()}};
function normalizedPhone(){const v=$('phone').value.replace(/[\s-]/g,'');if(/^09\d{8}$/.test(v))return '+886'+v.slice(1);if(/^\+8869\d{8}$/.test(v))return v;if(/^\+1[2-9]\d{2}[2-9]\d{6}$/.test(v))return v;throw new Error('請輸入有效的台灣手機號碼，或以 +1 開頭的美國測試號碼。')}
$('send').onclick=async()=>{if(busy||!captchaToken)return;busy=true;state();try{const phone=normalizedPhone();const {error}=await db.auth.signInWithOtp({phone,options:{captchaToken}});if(error)throw error;otpPhone=phone;note('驗證碼已發送，請查收簡訊。')}catch(e){err(e)}finally{captchaToken='';window.turnstile?.reset();busy=false;state()}};
$('verify').onclick=async()=>{if(busy||!otpPhone)return;busy=true;state();try{const {data,error}=await db.auth.verifyOtp({phone:otpPhone,token:$('otp').value.trim(),type:'sms'});if(error)throw error;user=data.user;note('手機驗證成功。');await refresh();if(tab==='mine')await mine()}catch(e){err(e)}finally{busy=false;state()}};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error){err(error);return}user=null;otpPhone='';state();mine();note('已登出。')};
window.onCaptchaReady=()=>{if(cfg.captchaSiteKey&&window.turnstile)turnstile.render('#captcha',{sitekey:cfg.captchaSiteKey,language:'zh-tw',callback:t=>{captchaToken=t;state()},'expired-callback':()=>{captchaToken='';state()},'error-callback':()=>{captchaToken='';state()}})};
async function init(){if(!cfg.key||!window.supabase){note('網站尚在設定中，暫不開放報名或預訂。');state();return}db=window.supabase.createClient(cfg.url,cfg.key);const {data}=await db.auth.getSession();user=data.session?.user;await refresh();if(!loaded){note('尚未連接活動資料庫，暫不開放報名或預訂。');return}note(settings.booking_open||settings.applications_open?'請選擇所需服務。':'目前尚未開放報名或預訂。');if(!cfg.captchaSiteKey)note('手機驗證防護尚未設定，暫不開放新登入。');db.auth.onAuthStateChange((_event,session)=>{user=session?.user;state()});setInterval(refresh,20000)}init().catch(err);
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onCaptchaReady&render=explicit" async defer></script></body></html>
